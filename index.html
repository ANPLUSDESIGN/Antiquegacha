<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オルゴールドーム型ガチャ V5</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:radial-gradient(circle at 50% 28%,#fffdf7 0,#f5efe3 58%,#e2d8c8 100%);
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
.stage{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.machine{
  position:relative;
  width:min(100vw,720px);
  aspect-ratio:1086/1448;
  overflow:visible;
}

/* 20.png 本体 */
.base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:20;
  pointer-events:none;
  filter:drop-shadow(0 20px 22px rgba(65,42,10,.18));
}

/* ===== 上のオルゴール機構 21.png =====
   下段カプセル部分は隠して、上部機構だけ大きく使う */
.inner-window{
  position:absolute;
  left:16%;
  top:10.5%;
  width:68%;
  height:48%;
  z-index:8;
  perspective:1150px;
  pointer-events:none;
  overflow:hidden;
}
.inner-rotor{
  position:absolute;
  left:50%;
  top:50%;
  width:96%;
  height:124%;
  object-fit:contain;
  transform:translate(-50%,-50%) rotateY(0deg);
  transform-origin:50% 48%;
  transform-style:preserve-3d;
  will-change:transform;
  clip-path:inset(0 0 24% 0);
  filter:drop-shadow(0 6px 7px rgba(61,34,3,.12));
}

/* 上は水平軸(Y軸)でゆっくり逆回転 */
.machine.running .inner-rotor{
  animation:upperHorizontal 5.2s cubic-bezier(.12,.55,.16,1) forwards;
}
@keyframes upperHorizontal{
  0%   {transform:translate(-50%,-50%) rotateY(0deg) scale(1)}
  70%  {transform:translate(-50%,-50%) rotateY(-580deg) scale(1.02)}
  88%  {transform:translate(-50%,-50%) rotateY(-690deg) scale(1.01)}
  100% {transform:translate(-50%,-50%) rotateY(-720deg) scale(1)}
}

/* ===== 下段カプセル台 ===== */
.capsule-orbit{
  position:absolute;
  inset:0;
  z-index:12;
  pointer-events:none;
}
.capsule{
  position:absolute;
  width:12.5%;
  aspect-ratio:1/1;
  object-fit:contain;
  transform:translate(-50%,-50%) scale(var(--s,1));
  filter:
    hue-rotate(var(--hue,0deg))
    saturate(1.12)
    brightness(var(--b,1))
    drop-shadow(0 4px 5px rgba(0,0,0,.18));
  will-change:left,top,transform,opacity,filter;
  transition:filter .22s, opacity .22s;
}
.capsule.selected{
  filter:
    hue-rotate(var(--hue,0deg))
    saturate(1.18)
    brightness(1.28)
    drop-shadow(0 0 14px rgba(255,226,120,.95))
    drop-shadow(0 0 27px rgba(255,188,52,.62));
}

/* ===== ハンドル 22.png =====
   22.png は真正面用。画像内の丸い回転軸を本体左の台座に合わせる */
.handle-hit{
  position:absolute;
  left:38.7%;
  top:73.0%;
  width:43%;
  aspect-ratio:1/1;
  z-index:32;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  transform:translate(-24.8%,-34.0%);
  transform-origin:24.8% 34.0%;
  -webkit-tap-highlight-color:transparent;
}
.handle{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  transform-origin:24.8% 34.0%;
  will-change:transform;
  filter:drop-shadow(0 5px 5px rgba(52,31,3,.25));
}
.machine.running .handle{
  animation:handleOneTurn 1.65s cubic-bezier(.15,.58,.18,1) forwards;
}
@keyframes handleOneTurn{
  0%{transform:rotate(0deg)}
  74%{transform:rotate(335deg)}
  100%{transform:rotate(360deg)}
}

/* 選ばれたカプセルが下へ落ちる */
.falling-capsule{
  position:absolute;
  width:12.5%;
  aspect-ratio:1/1;
  object-fit:contain;
  z-index:15; /* 本体より後ろ。土台に入ると隠れる */
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(1);
  will-change:left,top,transform,opacity;
}
.falling-capsule.drop{
  animation:dropIntoBody .76s cubic-bezier(.35,.05,.65,.95) forwards;
}
@keyframes dropIntoBody{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  55%{opacity:1;transform:translate(-50%,38%) scale(.92)}
  100%{opacity:0;transform:translate(-50%,165%) scale(.72)}
}

/* 排出口 */
.out-capsule{
  position:absolute;
  left:63.4%;
  top:76.1%;
  width:13%;
  aspect-ratio:1/1;
  object-fit:contain;
  z-index:42;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-85%) scale(.48) rotate(-10deg);
}
.out-capsule.show{
  animation:dispense .82s cubic-bezier(.16,.74,.18,1) forwards;
}
@keyframes dispense{
  0%{opacity:0;transform:translate(-50%,-88%) scale(.45) rotate(-12deg)}
  30%{opacity:1}
  75%{transform:translate(-50%,4%) scale(1.04) rotate(7deg)}
  100%{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}
}

/* 暖かいオルゴール光 */
.glow{
  position:absolute;
  left:50%;
  top:37%;
  width:66%;
  height:42%;
  transform:translate(-50%,-50%);
  z-index:6;
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle,rgba(255,244,203,.40),rgba(255,205,92,.10) 46%,transparent 72%);
}
.machine.running .glow{
  animation:glowPulse .8s ease-in-out infinite alternate;
}
@keyframes glowPulse{
  from{opacity:.12}
  to{opacity:.58}
}

/* 選択時の光 */
.pick-glow{
  position:absolute;
  width:19%;
  aspect-ratio:1/1;
  border-radius:50%;
  z-index:11;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-50%) scale(.35);
  background:radial-gradient(circle,#fff7d2 0,rgba(255,220,116,.72) 24%,rgba(255,182,42,.18) 55%,transparent 72%);
}
.pick-glow.on{
  animation:pickGlow .85s ease-out 2;
}
@keyframes pickGlow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  42%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
}

@media(max-width:480px){
  .machine{width:100vw}
}
</style>
</head>
<body>
<main class="stage">
  <section class="machine" id="machine">

    <div class="glow"></div>

    <!-- 21.png：上のオルゴール機構。大きく表示し、水平方向(Y軸)に回る -->
    <div class="inner-window">
      <img class="inner-rotor" src="21.png?v=5" alt="">
    </div>

    <!-- 23.png：下段カプセル。楕円軌道で水平方向に回る -->
    <div class="capsule-orbit" id="capsuleOrbit"></div>

    <div class="pick-glow" id="pickGlow"></div>
    <img class="falling-capsule" id="fallingCapsule" src="23.png?v=5" alt="">

    <!-- 20.png：本体 -->
    <img class="base" src="20.png?v=5" alt="オルゴールドーム型ガチャ">

    <!-- 22.png：正面ハンドル、排出口の左 -->
    <button class="handle-hit" id="handleButton" type="button" aria-label="ハンドルを回す">
      <img class="handle" src="22.png?v=5" alt="">
    </button>

    <!-- 排出 -->
    <img class="out-capsule" id="outCapsule" src="23.png?v=5" alt="">
  </section>
</main>

<script>
(() => {
  const machine = document.getElementById("machine");
  const handleButton = document.getElementById("handleButton");
  const orbit = document.getElementById("capsuleOrbit");
  const outCapsule = document.getElementById("outCapsule");
  const fallingCapsule = document.getElementById("fallingCapsule");
  const pickGlow = document.getElementById("pickGlow");

  const capsules = [];
  const COUNT = 8;

  let busy = false;
  let baseOffset = 0;

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  function machineSize(){
    const r = machine.getBoundingClientRect();
    return {w:r.width,h:r.height};
  }

  function createCapsules(){
    orbit.innerHTML = "";
    capsules.length = 0;

    for(let i=0;i<COUNT;i++){
      const img = document.createElement("img");
      img.src = "23.png?v=5";
      img.className = "capsule";
      img.style.setProperty("--hue", `${i * 43}deg`);
      orbit.appendChild(img);
      capsules.push(img);
    }
    layoutCapsules(baseOffset);
  }

  /* 下段は「水平な円盤」を正面から見た楕円軌道。
     sin値で奥/手前の大きさ・重なりも変える。 */
  function layoutCapsules(offset){
    const {w,h} = machineSize();

    const cx = w * .50;
    const cy = h * .485;
    const rx = w * .245;
    const ry = h * .045;

    capsules.forEach((img,i)=>{
      const a = (Math.PI * 2 * i / COUNT) + offset;
      const x = cx + Math.cos(a) * rx;
      const y = cy + Math.sin(a) * ry;

      const depth = (Math.sin(a) + 1) / 2; // 0=奥 1=手前
      const scale = .74 + depth * .34;
      const bright = .90 + depth * .16;

      img.style.left = `${x}px`;
      img.style.top = `${y}px`;
      img.style.zIndex = String(10 + Math.round(depth * 9));
      img.style.opacity = String(.74 + depth * .26);
      img.style.setProperty("--s", scale.toFixed(3));
      img.style.setProperty("--b", bright.toFixed(3));
    });
  }

  function rotateLower(duration=5200){
    return new Promise(resolve=>{
      const start = performance.now();
      const startOffset = baseOffset;
      const turns = Math.PI * 2 * 3.25; // 下段は3.25周

      function frame(now){
        const raw = Math.min(1,(now-start)/duration);
        const p = easeOutCubic(raw);

        /* 下段は時計方向 */
        baseOffset = startOffset + turns * p;
        layoutCapsules(baseOffset);

        if(raw < 1){
          requestAnimationFrame(frame);
        }else{
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function selectedFrontCapsule(){
    /* 止まった時に最も手前（sinが最大）にいるものを選ぶ */
    let best = null;
    let bestDepth = -Infinity;

    capsules.forEach((img,i)=>{
      const a = (Math.PI * 2 * i / COUNT) + baseOffset;
      const d = Math.sin(a);
      if(d > bestDepth){
        bestDepth = d;
        best = img;
      }
    });

    return best;
  }

  async function play(){
    if(busy) return;
    busy = true;

    outCapsule.classList.remove("show");
    fallingCapsule.classList.remove("drop");
    pickGlow.classList.remove("on");
    capsules.forEach(c=>c.classList.remove("selected"));

    machine.classList.remove("running");
    void machine.offsetWidth;
    machine.classList.add("running");

    if(navigator.vibrate){
      navigator.vibrate(18);
    }

    /* ①ハンドル1回転
       ②下段カプセル台 水平回転
       ③上段オルゴールは逆向きに水平方向へゆっくり */
    await rotateLower(5200);

    machine.classList.remove("running");

    /* ④ 徐々に停止 → 当選カプセル発光 */
    const selected = selectedFrontCapsule();
    selected.classList.add("selected");

    const rect = machine.getBoundingClientRect();
    const selectedRect = selected.getBoundingClientRect();

    const sx = selectedRect.left - rect.left + selectedRect.width/2;
    const sy = selectedRect.top - rect.top + selectedRect.height/2;

    pickGlow.style.left = `${sx}px`;
    pickGlow.style.top = `${sy}px`;
    pickGlow.classList.add("on");

    await wait(1150);

    /* ⑤ 選ばれたカプセルが下に落ちる */
    selected.style.opacity = "0";

    fallingCapsule.style.left = `${sx}px`;
    fallingCapsule.style.top = `${sy}px`;
    fallingCapsule.style.filter = getComputedStyle(selected).filter;
    fallingCapsule.style.opacity = "1";
    fallingCapsule.classList.add("drop");

    await wait(760);

    fallingCapsule.style.opacity = "0";

    /* 本体の中を通ったようにして右下排出口から出す */
    outCapsule.style.filter = getComputedStyle(selected).filter;
    outCapsule.classList.add("show");

    await wait(1050);

    selected.classList.remove("selected");
    selected.style.opacity = "";
    busy = false;
  }

  handleButton.addEventListener("click", play);

  window.addEventListener("resize",()=>{
    layoutCapsules(baseOffset);
  });

  createCapsules();
})();
</script>
</body>
</html>

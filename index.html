<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オルゴールドーム型ガチャ V4</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:radial-gradient(circle at 50% 28%,#fffdf8 0,#f4efe4 55%,#ded5c5 100%);
  overflow-x:hidden;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
.stage{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.machine{
  position:relative;
  width:min(100vw,720px);

  /* 20.png / 21.png の実寸比率に合わせる */
  aspect-ratio:1086 / 1448;
}

/* ===== 本体 20.png ===== */
.base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:10;
  pointer-events:none;
  filter:drop-shadow(0 18px 22px rgba(70,45,10,.18));
}

/* ===== 中身 21.png =====
   20.pngと同じ座標系で全面重ねする */
.inner-static,
.inner-spin{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
.inner-static{
  z-index:11;
}
.inner-spin{
  z-index:12;
  clip-path:circle(24% at 50% 37.5%);
  transform-origin:50% 37.5%;
  opacity:.90;
}

/* ハンドル動作中：中央機構だけ回転 */
.machine.running .inner-spin{
  animation:innerTurn 3.4s cubic-bezier(.14,.56,.18,1) forwards;
}
@keyframes innerTurn{
  0%{transform:rotate(0deg)}
  70%{transform:rotate(-635deg)}
  100%{transform:rotate(-720deg)}
}

/* ===== 正面ハンドル 22.png =====
   左側ハンドル台座の中心を回転軸に合わせる */
.handle-hit{
  position:absolute;

  /* 20.pngの正面左ハンドル台座 */
  left:39.6%;
  top:73.0%;

  width:35%;
  aspect-ratio:1/1;

  /* 22.png内の円盤中心を台座中心に合わせる */
  transform:translate(-24.8%,-34.0%);
  transform-origin:24.8% 34.0%;

  z-index:30;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.handle{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  transform-origin:24.8% 34.0%;
  filter:drop-shadow(0 5px 5px rgba(49,29,5,.28));
}
.machine.running .handle{
  animation:handleTurn 1.95s cubic-bezier(.12,.58,.18,1) forwards;
}
@keyframes handleTurn{
  0%{transform:rotate(0deg)}
  74%{transform:rotate(650deg)}
  100%{transform:rotate(720deg)}
}

/* ===== 動くカプセル 23.png ===== */
.capsule-ring{
  position:absolute;
  left:19%;
  top:42.5%;
  width:62%;
  height:16%;
  z-index:14;
  pointer-events:none;
  transform-origin:50% 50%;
}
.capsule{
  position:absolute;
  width:17%;
  aspect-ratio:1/1;
  object-fit:contain;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    translate(var(--x),var(--y));
  filter:
    hue-rotate(var(--hue))
    saturate(1.12)
    drop-shadow(0 4px 5px rgba(0,0,0,.18));
}
.machine.running .capsule-ring{
  animation:capsuleTurn 3.4s cubic-bezier(.14,.56,.18,1) forwards;
}
@keyframes capsuleTurn{
  0%{transform:rotate(0deg)}
  70%{transform:rotate(990deg)}
  100%{transform:rotate(1080deg)}
}

/* 排出口から出るカプセル */
.out-capsule{
  position:absolute;
  left:63.8%;
  top:73.8%;
  width:14%;
  aspect-ratio:1/1;
  object-fit:contain;
  z-index:40;
  opacity:0;
  transform:translate(-50%,-85%) scale(.48);
  pointer-events:none;
}
.out-capsule.show{
  animation:dispense .78s cubic-bezier(.16,.74,.18,1) forwards;
}
@keyframes dispense{
  0%{opacity:0;transform:translate(-50%,-90%) scale(.46) rotate(-12deg)}
  35%{opacity:1}
  76%{transform:translate(-50%,2%) scale(1.02) rotate(8deg)}
  100%{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}
}

/* 稼働中の暖色のきらめき */
.glow{
  position:absolute;
  left:50%;
  top:35%;
  width:67%;
  height:42%;
  transform:translate(-50%,-50%);
  z-index:9;
  border-radius:50%;
  opacity:0;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,241,188,.42),rgba(255,202,84,.11) 45%,transparent 72%);
}
.machine.running .glow{
  animation:glowPulse .72s ease-in-out infinite alternate;
}
@keyframes glowPulse{
  from{opacity:.12;transform:translate(-50%,-50%) scale(.98)}
  to{opacity:.58;transform:translate(-50%,-50%) scale(1.045)}
}

@media(max-width:480px){
  .machine{width:100vw}
}
</style>
</head>
<body>
<main class="stage">
  <section class="machine" id="machine">

    <div class="glow"></div>

    <!-- 21.png = 中身 -->
    <img class="inner-static" src="21.png?v=4" alt="">
    <img class="inner-spin" src="21.png?v=4" alt="">

    <!-- 23.png = カプセル -->
    <div class="capsule-ring" id="capsuleRing"></div>

    <!-- 20.png = 本体 -->
    <img class="base" src="20.png?v=4" alt="オルゴールドーム型ガチャ">

    <!-- 22.png = 正面ハンドル -->
    <button class="handle-hit" id="handleButton" type="button" aria-label="ガチャを回す">
      <img class="handle" src="22.png?v=4" alt="">
    </button>

    <img class="out-capsule" id="outCapsule" src="23.png?v=4" alt="">
  </section>
</main>

<script>
(() => {
  const machine = document.getElementById("machine");
  const handleButton = document.getElementById("handleButton");
  const capsuleRing = document.getElementById("capsuleRing");
  const outCapsule = document.getElementById("outCapsule");

  let busy = false;

  function buildCapsules(){
    capsuleRing.innerHTML = "";

    const count = 6;
    for(let i=0;i<count;i++){
      const a = (Math.PI * 2 * i / count) - Math.PI/2;
      const img = document.createElement("img");

      img.className = "capsule";
      img.src = "23.png?v=4";
      img.style.setProperty("--x", `${Math.cos(a) * 150}%`);
      img.style.setProperty("--y", `${Math.sin(a) * 35}%`);
      img.style.setProperty("--hue", `${i * 46}deg`);

      capsuleRing.appendChild(img);
    }
  }

  function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
  }

  async function play(){
    if(busy) return;
    busy = true;

    machine.classList.remove("running");
    outCapsule.classList.remove("show");
    void machine.offsetWidth;

    machine.classList.add("running");

    if(navigator.vibrate){
      navigator.vibrate([18,30,18]);
    }

    await wait(3400);

    outCapsule.classList.add("show");

    await wait(1050);

    machine.classList.remove("running");

    await wait(350);
    busy = false;
  }

  handleButton.addEventListener("click",play);
  buildCapsules();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antique Gacha V7</title>
<style>
:root{
  /* 20.png の実寸比率 1086×1448 を基準 */
  --handle-x: 39.05%;
  --handle-y: 73.05%;
  --handle-size: 19.2%;

  --inner-left: 21.5%;
  --inner-top: 6.8%;
  --inner-width: 57%;

  --capsule-cx: 50%;
  --capsule-cy: 50.2%;
  --capsule-rx: 23.0%;
  --capsule-ry: 4.1%;
  --capsule-size: 14.5%;

  --chute-x: 63.0%;
  --chute-y: 74.7%;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 28%,#fffefa 0,#f6f0e5 56%,#e2d8c8 100%);
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
.stage{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.machine{
  position:relative;
  width:min(100vw,720px);
  aspect-ratio:1086/1448;
  overflow:visible;
}

/* ---------- 20.png 本体 ---------- */
.base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:20;
  pointer-events:none;
  filter:drop-shadow(0 20px 23px rgba(68,43,9,.18));
}

/* ---------- 21.png 内部機構 ----------
   1枚を「上・中央・下」の3層に分け、
   回転中だけ左右にわずかにずらして立体的な水平回転に見せる。
   rotateZ / 上下回転 / 大きなrotateYは一切使わない。 */
.inner-piece{
  position:absolute;
  left:var(--inner-left);
  top:var(--inner-top);
  width:var(--inner-width);
  height:auto;
  z-index:9;
  pointer-events:none;
  object-fit:contain;
  transform:translateX(0) scaleX(1);
  transform-origin:50% 50%;
  will-change:transform,filter,opacity;
  filter:drop-shadow(0 5px 6px rgba(59,35,7,.12));
}

/* 上部：吊り飾り・上リング */
.inner-top{
  clip-path:inset(16% 0 57% 0);
}
/* 中央：天球儀・リング・歯車 */
.inner-mid{
  clip-path:inset(42% 0 33% 0);
}
/* 下部：内部の金色台座だけ。元画像のカプセル列は切る */
.inner-low{
  clip-path:inset(66% 0 23% 0);
}

.machine.running .inner-top{
  animation:innerTopMove 7.2s cubic-bezier(.26,.06,.18,1) forwards;
}
.machine.running .inner-mid{
  animation:innerMidMove 7.2s cubic-bezier(.26,.06,.18,1) forwards;
}
.machine.running .inner-low{
  animation:innerLowMove 7.2s cubic-bezier(.26,.06,.18,1) forwards;
}

/* 「水平回転」＝左右へ回り込む視差。
   紙のように裏返さず、パーツ同士の前後感で見せる。 */
@keyframes innerTopMove{
  0%   {transform:translateX(0) scaleX(1);filter:brightness(1)}
  18%  {transform:translateX(-2.8%) scaleX(.985);filter:brightness(.96)}
  43%  {transform:translateX(2.8%) scaleX(1.012);filter:brightness(1.05)}
  68%  {transform:translateX(-2.0%) scaleX(.99);filter:brightness(.98)}
  88%  {transform:translateX(.8%) scaleX(1.004);filter:brightness(1.02)}
  100% {transform:translateX(0) scaleX(1);filter:brightness(1)}
}
@keyframes innerMidMove{
  0%   {transform:translateX(0) scaleX(1);filter:brightness(1)}
  18%  {transform:translateX(3.8%) scaleX(1.015);filter:brightness(1.06)}
  43%  {transform:translateX(-3.8%) scaleX(.982);filter:brightness(.95)}
  68%  {transform:translateX(2.8%) scaleX(1.01);filter:brightness(1.04)}
  88%  {transform:translateX(-1.1%) scaleX(.996);filter:brightness(.99)}
  100% {transform:translateX(0) scaleX(1);filter:brightness(1)}
}
@keyframes innerLowMove{
  0%   {transform:translateX(0) scaleX(1)}
  20%  {transform:translateX(-1.9%) scaleX(.992)}
  45%  {transform:translateX(2.1%) scaleX(1.007)}
  70%  {transform:translateX(-1.4%) scaleX(.996)}
  100% {transform:translateX(0) scaleX(1)}
}

/* ---------- 23.png 下段カプセル ----------
   実際に楕円軌道を回るので「左右方向の水平回転」に見える。 */
.capsule-orbit{
  position:absolute;
  inset:0;
  z-index:13;
  pointer-events:none;
}
.capsule{
  position:absolute;
  width:var(--capsule-size);
  aspect-ratio:1/1;
  object-fit:contain;
  transform:translate(-50%,-50%) scale(var(--scale,1));
  transform-origin:50% 50%;
  will-change:left,top,transform,opacity,filter;
  filter:
    hue-rotate(var(--hue,0deg))
    saturate(1.08)
    brightness(var(--bright,1))
    drop-shadow(0 4px 5px rgba(0,0,0,.18));
}
.capsule.selected{
  filter:
    hue-rotate(var(--hue,0deg))
    saturate(1.16)
    brightness(1.28)
    drop-shadow(0 0 12px rgba(255,241,181,.95))
    drop-shadow(0 0 24px rgba(255,192,61,.68));
}

/* ---------- 22.png 正面銀ハンドル ---------- */
.handle-button{
  position:absolute;
  left:var(--handle-x);
  top:var(--handle-y);
  width:var(--handle-size);
  aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  transform-origin:50% 50%;
  z-index:32;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.handle{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  transform-origin:50% 50%;
  will-change:transform;
  filter:drop-shadow(0 4px 5px rgba(28,20,8,.25));
}
.machine.running .handle{
  animation:handleTurn 1.55s cubic-bezier(.16,.62,.18,1) forwards;
}
@keyframes handleTurn{
  0%{transform:rotate(0deg)}
  72%{transform:rotate(335deg)}
  100%{transform:rotate(360deg)}
}

/* ---------- 当選カプセル落下 ---------- */
.falling{
  position:absolute;
  width:var(--capsule-size);
  aspect-ratio:1/1;
  object-fit:contain;
  z-index:15; /* 20.pngより後ろなので、本体に入ると隠れる */
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(1);
}
.falling.drop{
  animation:dropIn .86s cubic-bezier(.36,.04,.62,.98) forwards;
}
@keyframes dropIn{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1)}
  54% {opacity:1;transform:translate(-50%,40%) scale(.91)}
  100%{opacity:0;transform:translate(-50%,175%) scale(.70)}
}

/* ---------- 右下排出口 ---------- */
.out-capsule{
  position:absolute;
  left:var(--chute-x);
  top:var(--chute-y);
  width:13.5%;
  aspect-ratio:1/1;
  object-fit:contain;
  z-index:42;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-90%) scale(.42) rotate(-12deg);
}
.out-capsule.show{
  animation:dispense .92s cubic-bezier(.15,.76,.18,1) forwards;
}
@keyframes dispense{
  0%  {opacity:0;transform:translate(-50%,-95%) scale(.42) rotate(-12deg)}
  24% {opacity:1}
  72% {transform:translate(-50%,7%) scale(1.05) rotate(8deg)}
  100%{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}
}

/* ---------- 光 ---------- */
.dome-glow{
  position:absolute;
  left:50%;
  top:39%;
  width:64%;
  height:43%;
  transform:translate(-50%,-50%);
  z-index:7;
  opacity:0;
  pointer-events:none;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,247,207,.35) 0,
    rgba(255,218,122,.11) 48%,
    transparent 72%);
}
.machine.running .dome-glow{
  animation:domeGlow 1.15s ease-in-out infinite alternate;
}
@keyframes domeGlow{
  from{opacity:.06}
  to{opacity:.38}
}

.pick-glow{
  position:absolute;
  width:19%;
  aspect-ratio:1/1;
  z-index:12;
  border-radius:50%;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(.35);
  background:radial-gradient(circle,
    #fffce6 0,
    rgba(255,226,135,.80) 22%,
    rgba(255,185,44,.20) 53%,
    transparent 72%);
}
.pick-glow.on{
  animation:pick .72s ease-out 2;
}
@keyframes pick{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  38%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
}

@media(max-width:480px){
  .machine{width:100vw}
}
</style>
</head>
<body>
<main class="stage">
  <section class="machine" id="machine">

    <div class="dome-glow"></div>

    <!-- 21.png：1枚を3層に切って、水平の立体視差で動かす -->
    <img class="inner-piece inner-top" src="21.png?v=7" alt="">
    <img class="inner-piece inner-mid" src="21.png?v=7" alt="">
    <img class="inner-piece inner-low" src="21.png?v=7" alt="">

    <!-- 23.png：下段カプセル -->
    <div class="capsule-orbit" id="capsuleOrbit"></div>
    <div class="pick-glow" id="pickGlow"></div>
    <img class="falling" id="fallingCapsule" src="23.png?v=7" alt="">

    <!-- 20.png：本体固定 -->
    <img class="base" src="20.png?v=7" alt="オルゴールドーム型ガチャ">

    <!-- 22.png：正面銀ハンドル -->
    <button class="handle-button" id="handleButton" type="button" aria-label="ガチャを回す">
      <img class="handle" src="22.png?v=7" alt="">
    </button>

    <img class="out-capsule" id="outCapsule" src="23.png?v=7" alt="">
  </section>
</main>

<script>
(() => {
  const machine = document.getElementById("machine");
  const handleButton = document.getElementById("handleButton");
  const orbit = document.getElementById("capsuleOrbit");
  const falling = document.getElementById("fallingCapsule");
  const outCapsule = document.getElementById("outCapsule");
  const pickGlow = document.getElementById("pickGlow");

  const COUNT = 8;
  const capsules = [];
  let phase = 0;
  let busy = false;

  const wait = ms => new Promise(r => setTimeout(r,ms));

  function size(){
    const r = machine.getBoundingClientRect();
    return {w:r.width,h:r.height};
  }

  function buildCapsules(){
    orbit.innerHTML = "";
    capsules.length = 0;

    for(let i=0;i<COUNT;i++){
      const img = document.createElement("img");
      img.className = "capsule";
      img.src = "23.png?v=7";
      img.style.setProperty("--hue", `${i*41}deg`);
      orbit.appendChild(img);
      capsules.push(img);
    }
    renderOrbit(phase);
  }

  /* 水平円盤を正面から見た楕円。
     奥＝小さい/暗い、手前＝大きい/明るい。 */
  function renderOrbit(offset){
    const {w,h} = size();

    const cx = w * .50;
    const cy = h * .500;
    const rx = w * .230;
    const ry = h * .041;

    capsules.forEach((el,i)=>{
      const a = (Math.PI*2*i/COUNT) + offset;

      const x = cx + Math.cos(a)*rx;
      const y = cy + Math.sin(a)*ry;

      const depth = (Math.sin(a)+1)/2;
      const scale = .70 + depth*.39;
      const bright = .88 + depth*.17;

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.zIndex = `${10 + Math.round(depth*9)}`;
      el.style.opacity = `${.68 + depth*.32}`;
      el.style.setProperty("--scale", scale.toFixed(3));
      el.style.setProperty("--bright", bright.toFixed(3));
    });
  }

  /* 最初は速く、最後はゆっくり止まる。
     上下には回さず、左右方向だけ。 */
  function spinCapsules(duration=7200){
    return new Promise(resolve=>{
      const start = performance.now();
      const startPhase = phase;
      const total = Math.PI*2*3.15;

      function easeOutQuint(t){
        return 1 - Math.pow(1-t,5);
      }

      function frame(now){
        const t = Math.min(1,(now-start)/duration);
        const p = easeOutQuint(t);

        phase = startPhase + total*p;
        renderOrbit(phase);

        if(t < 1){
          requestAnimationFrame(frame);
        }else{
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function frontCapsule(){
    let best = null;
    let bestDepth = -Infinity;

    capsules.forEach((el,i)=>{
      const a = (Math.PI*2*i/COUNT) + phase;
      const d = Math.sin(a);
      if(d > bestDepth){
        bestDepth = d;
        best = el;
      }
    });
    return best;
  }

  async function play(){
    if(busy) return;
    busy = true;

    outCapsule.classList.remove("show");
    falling.classList.remove("drop");
    pickGlow.classList.remove("on");
    capsules.forEach(c=>{
      c.classList.remove("selected");
      c.style.visibility = "visible";
    });

    machine.classList.remove("running");
    void machine.offsetWidth;
    machine.classList.add("running");

    if(navigator.vibrate){
      navigator.vibrate([16,28,16]);
    }

    /* ハンドル1回転 + 上部機構の水平視差 + 下段水平回転 */
    await spinCapsules(7200);

    machine.classList.remove("running");

    const selected = frontCapsule();
    selected.classList.add("selected");

    const mr = machine.getBoundingClientRect();
    const sr = selected.getBoundingClientRect();
    const sx = sr.left - mr.left + sr.width/2;
    const sy = sr.top  - mr.top  + sr.height/2;

    pickGlow.style.left = `${sx}px`;
    pickGlow.style.top = `${sy}px`;
    pickGlow.classList.add("on");

    await wait(1050);

    /* カプセルが本体へ落ちる */
    falling.style.left = `${sx}px`;
    falling.style.top = `${sy}px`;
    falling.style.filter = getComputedStyle(selected).filter;
    falling.style.opacity = "1";
    falling.classList.add("drop");
    selected.style.visibility = "hidden";

    await wait(860);
    falling.style.opacity = "0";

    /* 同じカプセルが右下排出口から出る */
    outCapsule.style.filter = getComputedStyle(selected).filter;
    outCapsule.classList.add("show");

    await wait(1100);

    selected.classList.remove("selected");
    selected.style.visibility = "visible";
    busy = false;
  }

  handleButton.addEventListener("click",play);
  window.addEventListener("resize",()=>renderOrbit(phase));

  buildCapsules();
})();
</script>
</body>
</html>
